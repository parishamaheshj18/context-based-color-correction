# Showcase manifest: `ncc showcase` turns these photos into site/data/cases.json and site/assets.
# Charts are hidden from every stage and used only for scoring (corners = centers of patches
# 1, 6, 19, 24 in normalized image coordinates; mask_box = region blacked out before inference).

processing_long_edge_px: 2048
display_long_edge_px: 1600

config_overrides:
  io: {raw_half_size: true}
  camera: {sensitivity_dir: Data}
  context: {client: anthropic, cache_dir: showcase/vlm_cache}
  # box needs no PyTorch, so the showcase builds on any machine; sam needs the ml extra.
  detection: {detector: vlm, segmenter: box, device: cpu}

cases:
  - id: lab-shelf-warm
    title: Warm room light on a shelf
    image: Data/ColorChart Images/IMG_7879.CR3
    intent: neutral
    chart:
      corners: [[0.4914, 0.3124], [0.5754, 0.3124], [0.4914, 0.3811], [0.5754, 0.3811]]
      mask_box: [0.4582, 0.1418, 0.6092, 0.4154]

  - id: lab-dark-stage
    title: Spot-lit stage on a black background
    image: Data/ColorChart Images/IMG_7890.CR3
    intent: neutral
    chart:
      corners: [[0.2321, 0.5448], [0.3513, 0.5413], [0.2324, 0.6502], [0.3536, 0.6463]]
      mask_box: [0.1826, 0.2935, 0.3934, 0.7015]

  - id: bluebird-garden
    title: Eastern bluebird on a shrub
    image: Data/ColorChart Images/IMG_2947.DNG
    intent: neutral
    caption: >-
      A hard case. Leaves are the only reference here, and using leaves needs the camera's spectral
      curves, which do not exist for the iPhone 16 Pro. The physics falls back to a statistical
      estimate, and the critic flags the result as too cool.

  - id: forest-shade
    title: Forest trail in deep shade
    image: Data/ColorChart Images/IMG_9500.DNG
    intent: neutral

  - id: conservatory-fountain
    title: Conservatory fountain under a glass roof
    image: Data/ColorChart Images/IMG_2607.HEIC
    intent: neutral

  - id: kitchen-roses
    title: Red roses in a kitchen
    image: Data/ColorChart Images/IMG_6470 2.HEIC
    intent: neutral

  - id: bronze-sculpture
    title: Bronze sculpture in a tropical garden
