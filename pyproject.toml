[project]
name = "natural-color-charts"
version = "0.1.0"
description = "Context-aware color correction without a color checker"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "colour-science>=0.4.4",
    "rawpy>=0.19",
    "exifread>=3.0",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "tifffile>=2023.7",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.30"]
anthropic = ["anthropic>=0.40"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
ncc = "natural_color_charts.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/natural_color_charts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N803", "N806", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
# numpy returns Any from many operations; flagging every one adds noise, not safety.
warn_return_any = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
