# Default configuration. Every tunable value in the pipeline lives here.

spectral:
  wavelength_start_nm: 400
  wavelength_stop_nm: 700
  wavelength_step_nm: 10

io:
  raw_half_size: false
  saturation_threshold: 0.98
  preview_long_edge_px: 1024

camera:
  sensitivity_dir: data/camera_sensitivities
  include_builtin: true
  headerless_start_nm: 400   # .xlsx / 3-column .txt files without a wavelength column
  headerless_step_nm: 10
  fuzzy_match_cutoff: 0.6
  use_same_make_fallback: false
  force_camera: null        # e.g. "sRGB-equivalent (CIE 1931)" for the generic-curves ablation

context:
  client: none            # none | ollama | anthropic
  cache_dir: null         # directory of cached VLM answers, e.g. showcase/vlm_cache
  max_retries: 2
  preview_long_edge_px: 768
  default_families: [daylight, blackbody]
  default_candidate_confidence: 0.5
  default_ambiance_strength: 0.6
  ollama:
    host: http://localhost:11434
    model: qwen2.5vl:7b
    timeout_s: 180
  anthropic:
    model: claude-opus-5-5
    max_tokens: 4096        # a revision repeats the whole scene answer

review:                   # agent loop: an independent critic judges each correction
  max_rounds: 3             # critiques per photo; 0 turns the loop off. Needs a context client.
  critic_model: null        # null = the context model; a different model is a more independent critic
  acceptable_severity: 0.10 # stop once the critic accepts, doubts no reference, and rates the cast at most this
  min_spread_delta_e: 2.0   # ΔE*ab within which any reference counts as matching its material
  sheet_width_px: 1568      # width of the before/after review sheet the critic sees

detection:
  detector: none          # none | manual | vlm (boxes from scene analysis) | transformers
  segmenter: box          # box | sam
  device: cpu             # cpu | cuda | mps
  detector_model: google/owlv2-base-patch16-ensemble
  segmenter_model: facebook/sam-vit-base
  score_threshold: 0.2
  max_regions_per_label: 3
  iou_threshold: 0.5
  box_inset_fraction: 0.1
  manual_sidecar_suffix: .regions.json
  excluded_classes: []
  coherence_max_chroma_distance: 0.04   # 0 disables
  skin_cr_range: [133, 173]
  skin_cb_range: [77, 127]
  prompts:
    foliage: [green leaves, green grass]
    skin: [human face, human hand]
    concrete: [gray concrete]
    paper: [white paper]
    snow: [snow]
    cloud: [white cloud]
    neutral_surface: [white plastic surface, white painted wall, gray painted wall, white tabletop]

patches:
  erosion_fraction: 0.004
  noise_floor: 0.002
  specular_luminance_quantile: 0.95
  specular_chroma_ratio: 0.5
  statistic: trimmed_mean  # trimmed_mean | median
  trim_fraction: 0.1
  min_valid_pixels: 200
  full_weight_pixels: 5000
  full_weight_luminance: 0.05
  outdoor_paper_factor: 0.5
  use_reliability_weights: true
  user_anchor_weight: 2.0   # user color matches outweigh any AI-trusted region
  class_prior_strength:
    paper: 0.9
    snow: 0.9
    concrete: 0.8
    cloud: 0.7
    neutral_surface: 0.5
    foliage: 0.5
    skin: 0.3

priors:
  directory: data/priors
  library_dir: data/reflectance_spectra
  bootstrap_if_missing: true
  components: 3
  min_samples_for_pca: 6
  relative_shape_sigma: 0.05   # per-wavelength std as a fraction of mean reflectance

estimation:
  fallback_chain: [spectral, neutral_patches, shades_of_gray]
  families:
    daylight: {cct_min_k: 4000, cct_max_k: 25000}
    blackbody: {cct_min_k: 1800, cct_max_k: 6500}
  grid_step_mired: 5.0
  chromaticity_sigma: 0.004
  context_prior_weight: 1.0
  robust_loss: soft_l1
  robust_scale: 2.0
  loo_min_references: 3
  loo_outlier_cost: 16.0   # χ² units (2 dof); 16 is far beyond the 99.9th percentile
  confidence_residual_scale_deg: 3.0
  fallback_confidence: 0.2
  shades_of_gray_power: 6.0
  gray_edge_power: 6.0
  gray_edge_sigma: 1.0
  white_patch_percentile: 99.5
  statistics_max_pixels: 250000

correction:
  training_set: BabelColor Average
  target_illuminant: D65
  refine_delta_e: false
  raster_method: bradford   # bradford | spectral
  adaptation_transform: Bradford  # Bradford | CAT16

render:
  exposure_percentile: 98.0
  exposure_target: 0.85
  normalize_raster_exposure: false

output:
  directory: outputs
  jpeg_quality: 95
  overlay_alpha_max: 0.6

learning:
  helpfulness_margin_deg: 0.1

evaluation:
  chart_mask_value: 0.0
  white_patch_index: 18
